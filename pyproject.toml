[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gimbal-2dof"
version = "1.0.0"
description = "Modello dinamico rigido a 2 GdL del gimbal alt-azimutale"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
